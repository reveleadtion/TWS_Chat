<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Two Wild Souls · Studio Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F7F5F2;--surface:#ECEAE6;--warm:#F0EDE8;
  --text:#2E2F2C;--text2:#6B6E6A;--text3:#aaa;
  --sage:#7C8A5A;--forest:#3F4438;--gold:#C7B27A;
  --border:#DDD9D3;--faint:rgba(46,47,44,0.08);--urgent:#B03010;
}
html,body{height:100%;background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased}
#app{display:flex;flex-direction:column;height:100dvh;max-width:430px;margin:0 auto;background:var(--bg);border-left:1px solid var(--faint);border-right:1px solid var(--faint)}

/* IFRAME CLOSE BUTTON — visible only when embedded */
#iframe-close{display:none;width:32px;height:32px;border:none;background:none;cursor:pointer;padding:0;align-items:center;justify-content:center;border-radius:50%;transition:background .15s;-webkit-tap-highlight-color:transparent;flex-shrink:0;margin-left:8px}
#iframe-close:hover{background:rgba(63,68,56,.07)}
#iframe-close svg{display:block}
body.in-iframe #iframe-close{display:flex}
/* iOS keyboard — shrink to visual viewport height */
body.ios-kb #app{height:var(--vvh,100dvh)}

/* HEADER */
#header{padding:13px 18px 12px;border-bottom:1px solid var(--faint);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.h-title{font-family:'Cormorant Garamond',serif;font-size:15px;font-weight:400;letter-spacing:.04em;color:var(--text)}
.h-title em{font-style:italic;color:var(--gold)}
.h-sub{font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:var(--text2);margin-top:2px}
.h-right{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.h-status{display:flex;align-items:center;gap:5px}
.h-dot{width:5px;height:5px;border-radius:50%;background:var(--sage);animation:pulse 2.5s ease-in-out infinite}
.h-label{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--sage)}
.h-reply{font-size:8.5px;color:var(--text3);letter-spacing:.03em}

/* SCROLL AREA */
#messages{flex:1;overflow-y:auto;padding:16px 14px 8px;-webkit-overflow-scrolling:touch}
#messages::-webkit-scrollbar{width:3px}
#messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* CHIPS */
#chips{padding:10px 14px 18px;display:flex;flex-wrap:wrap;gap:7px;justify-content:flex-end;border-top:1px solid var(--faint);background:var(--bg);flex-shrink:0}
#chips.hidden{display:none}
.chip{background:var(--bg);border:1.5px solid var(--border);border-radius:100px;padding:9px 15px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:300;color:var(--text);cursor:pointer;transition:all .18s;letter-spacing:.01em}
.chip:hover{background:rgba(124,138,90,.08);border-color:var(--sage);color:var(--forest);font-weight:400}

/* ANIMATIONS */
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-4px);opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.fade-up{animation:fadeUp .32s cubic-bezier(.22,.61,.36,1) both}

/* BUBBLE WRAPPERS */
.row{display:flex;gap:8px;align-items:flex-end;margin-bottom:8px}
.row.studio{flex-direction:row}
.row.user{flex-direction:row-reverse}

/* AVATAR */
.avatar{width:32px;height:32px;border-radius:50%;flex-shrink:0;overflow:hidden;align-self:flex-end;margin-bottom:2px;box-shadow:0 1px 6px rgba(63,68,56,.28);border:1.5px solid var(--gold)}
.avatar img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}

/* TEXT BUBBLES */
.bubble-text{max-width:80%;padding:10px 14px;border-radius:3px 14px 14px 14px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:300;line-height:1.68;letter-spacing:.01em}
.bubble-text.studio{background:var(--warm);color:var(--text);border:1px solid var(--border)}
.bubble-text.user{background:var(--forest);color:var(--bg);border-radius:14px 3px 14px 14px}

/* TYPING */
.typing-bubble{padding:13px 15px;background:var(--warm);border:1px solid var(--border);border-radius:3px 14px 14px 14px;display:flex;gap:5px;align-items:center}
.dot{width:5px;height:5px;border-radius:50%;background:var(--text2)}
.dot:nth-child(1){animation:bounce 1.15s ease-in-out 0s infinite}
.dot:nth-child(2){animation:bounce 1.15s ease-in-out .18s infinite}
.dot:nth-child(3){animation:bounce 1.15s ease-in-out .36s infinite}

/* CARD SHARED */
.card{max-width:85%;border-radius:3px 14px 14px 14px;padding:14px 15px;font-family:'DM Sans',sans-serif}
.card-label{font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}

/* TESTIMONIAL CARD */
.card-testimonial{background:var(--bg);border:1px solid var(--border);border-left:3px solid var(--gold)}
.card-testimonial .quote{font-family:'Cormorant Garamond',serif;font-size:15px;font-style:italic;color:var(--text);line-height:1.65;margin-bottom:8px;font-weight:300}
.card-testimonial .attr{font-size:10px;color:var(--text3);letter-spacing:.06em}

/* INCLUDES CARD */
.card-includes{background:var(--warm);border:1px solid var(--border)}
.include-row{display:flex;gap:9px;align-items:flex-start;margin-bottom:8px}
.include-row:last-child{margin-bottom:0}
.include-dot{width:16px;height:16px;border-radius:50%;background:rgba(124,138,90,.12);border:1px solid rgba(124,138,90,.3);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.include-dot-inner{width:5px;height:5px;border-radius:50%;background:var(--sage)}
.include-text{font-size:12px;color:var(--text);line-height:1.5;font-weight:300}

/* COMPARISON CARD */
.card-comparison{max-width:86%;overflow:hidden;border:1px solid var(--border);border-radius:3px 14px 14px 14px;box-shadow:0 2px 12px rgba(0,0,0,.05)}
.comp-grid{display:grid;grid-template-columns:1fr 1fr}
.comp-cell{padding:8px 11px;font-size:11px;line-height:1.45}
.comp-head{background:var(--forest)}
.comp-head .comp-cell{font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:rgba(199,178,122,.8);font-weight:500}
.comp-head .comp-cell:first-child{border-right:1px solid rgba(255,255,255,.08)}
.comp-row-even{background:var(--warm)}
.comp-row-odd{background:var(--bg)}
.comp-row-even .comp-cell:first-child,.comp-row-odd .comp-cell:first-child{border-right:1px solid var(--border);color:rgba(176,48,16,.7);text-decoration:line-through;font-weight:300}
.comp-row-even .comp-cell:last-child,.comp-row-odd .comp-cell:last-child{color:var(--sage);font-weight:400}
.comp-row-divider{border-bottom:1px solid var(--border)}

/* PROCESS CARD */
.card-process{background:var(--warm);border:1px solid var(--border)}
.process-step{display:flex;gap:11px;margin-bottom:12px}
.process-step:last-child{margin-bottom:0}
.step-num{font-family:'Cormorant Garamond',serif;font-size:17px;color:var(--gold);flex-shrink:0;line-height:1;margin-top:1px}
.step-title{font-size:12px;font-weight:500;color:var(--text);margin-bottom:3px;letter-spacing:.01em}
.step-body{font-size:11px;color:var(--text2);line-height:1.58}

/* QUOTE CARD */
.card-quote{background:var(--forest);border-radius:3px 14px 14px 14px;padding:16px 17px;position:relative;overflow:hidden}
.card-quote::before{content:'';position:absolute;top:0;right:0;width:80px;height:80px;background:radial-gradient(circle at 100% 0%,rgba(199,178,122,.12) 0%,transparent 70%)}
.card-quote .q-label{font-size:8px;letter-spacing:.22em;text-transform:uppercase;color:rgba(199,178,122,.75);margin-bottom:6px;position:relative}
.card-quote .q-price{font-family:'Cormorant Garamond',serif;font-size:40px;font-weight:300;color:#fff;line-height:1;margin-bottom:3px;position:relative}
.card-quote .q-pkg{font-size:10px;color:rgba(247,245,242,.4);margin-bottom:14px;letter-spacing:.04em;position:relative}
.card-quote .q-note{font-size:11.5px;color:rgba(199,178,122,.88);line-height:1.65;border-top:1px solid rgba(255,255,255,.08);padding-top:11px;position:relative}

/* CONFIRM CARD */
.card-confirm{border-radius:3px 14px 14px 14px;padding:16px 17px;position:relative;overflow:hidden}
.card-confirm.dark{background:var(--forest)}
.card-confirm.light{background:var(--warm);border:1px solid var(--border)}
.card-confirm.dark::before{content:'';position:absolute;top:0;right:0;width:100px;height:100px;background:radial-gradient(circle at 100% 0%,rgba(199,178,122,.1) 0%,transparent 70%)}
.conf-tag{font-size:8px;letter-spacing:.22em;text-transform:uppercase;margin-bottom:7px;display:flex;align-items:center;gap:6px;position:relative}
.dark .conf-tag{color:rgba(199,178,122,.75)}
.light .conf-tag{color:var(--gold)}
.conf-check{width:14px;height:14px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px}
.dark .conf-check{background:rgba(124,138,90,.3);color:var(--sage)}
.light .conf-check{background:rgba(124,138,90,.15);color:var(--sage)}
.conf-headline{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:300;line-height:1.15;margin-bottom:7px;position:relative}
.dark .conf-headline{color:#fff}
.light .conf-headline{color:var(--text)}
.conf-body{font-size:12px;line-height:1.68;margin-bottom:10px;position:relative}
.dark .conf-body{color:rgba(247,245,242,.8)}
.light .conf-body{color:var(--text2)}
.conf-sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:11px;line-height:1.55;padding-top:9px;position:relative}
.dark .conf-sub{color:rgba(199,178,122,.82);border-top:1px solid rgba(255,255,255,.08)}
.light .conf-sub{color:var(--text2);border-top:1px solid var(--border)}

/* PETITE RECOMMENDATION CARD */
.card-petite{background:var(--warm);border:1px solid var(--border)}
.petite-intro{font-size:12px;color:var(--text2);line-height:1.68;margin-bottom:13px}
.petite-price-row{display:flex;align-items:baseline;gap:8px;margin-bottom:12px}
.petite-price{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:300;color:var(--text);line-height:1}
.petite-was{font-size:11px;color:var(--text3);text-decoration:line-through;letter-spacing:.02em}
.petite-items{margin-bottom:13px}
.petite-item{display:flex;gap:9px;align-items:flex-start;margin-bottom:7px}
.petite-item:last-child{margin-bottom:0}
.petite-check{width:15px;height:15px;border-radius:50%;background:rgba(124,138,90,.12);border:1px solid rgba(124,138,90,.3);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;font-size:8px;color:var(--sage)}
.petite-item-text{font-size:12px;color:var(--text);line-height:1.5;font-weight:300}
.petite-item-text span{font-size:10.5px;color:var(--text2);display:block;margin-top:1px}
.petite-note{font-size:10.5px;font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--text2);line-height:1.55;border-top:1px solid var(--border);padding-top:10px;margin-bottom:12px}
.naf-link{display:block;text-align:center;padding:12px 14px;background:linear-gradient(135deg,var(--forest) 0%,#4d5542 100%);color:var(--bg);border-radius:5px;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;transition:opacity .18s}
.naf-link:hover{opacity:.85}

/* FORM */
.card-form{background:var(--warm);border:1px solid var(--border)}
.form-row{display:flex;gap:7px;margin-bottom:7px}
.form-row input{flex:1}
input[type=text],input[type=email],input[type=tel]{width:100%;padding:11px 12px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:300;color:var(--text);background:var(--surface);border-radius:4px;border:1.5px solid var(--border);outline:none;transition:border-color .2s;display:block;margin-bottom:7px}
input:focus{border-color:var(--sage)}
input.error{border-color:var(--urgent)}
.form-error{font-size:10.5px;color:var(--urgent);margin-bottom:9px}
.form-btn{width:100%;background:linear-gradient(135deg,var(--forest) 0%,#4d5542 100%);color:var(--bg);border:none;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;padding:14px;border-radius:5px;cursor:pointer;transition:all .22s}
.form-btn:disabled{background:var(--text2);cursor:not-allowed}
.form-note{font-size:10px;color:var(--text3);text-align:center;margin-top:9px;line-height:1.55}
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div style="display:flex;align-items:center;gap:10px">
      <div style="width:38px;height:38px;border-radius:50%;overflow:hidden;flex-shrink:0;border:1.5px solid var(--gold);box-shadow:0 1px 6px rgba(63,68,56,.2)">
        <img src="https://static.showit.co/file/N0mLcuchHvT5zhas9MUvfg/331377/2025_headshot_7542-min.jpg" alt="Jasmine" style="width:100%;height:100%;object-fit:cover;object-position:center top;display:block">
      </div>
      <div>
        <div class="h-title"><em>Jasmine</em></div>

<script>
// ─── CONFIG ────────────────────────────────────────────────────────
let KLAVIYO_PUBLIC_KEY = 'YOUR_PUBLIC_KEY';
let KLAVIYO_LIST_ID    = 'YOUR_LIST_ID';

// ─── DATA ──────────────────────────────────────────────────────────
const PRICING = {
  'Maternity':         { price: '$1,290+', label: 'Custom Session', note: 'Studio, in-home, or outdoor — your choice. Hair & makeup and gown styling available.' },

const PROOF_POOLS = {

    { quote: '"I absolutely loved my maternity pictures. They did a wonderful job with my hair and makeup too. She provided dresses with different options... Definitely worth every penny."', name: 'Mariah M.' },

};
PROOF_POOLS['Boudoir Maternity'] = PROOF_POOLS['Maternity'];

// Track last shown index per genre to avoid immediate repeats
const proofIndexes = {};
function getProof(session) {
  const pool = PROOF_POOLS[session] || PROOF_POOLS['Maternity'];
  const last = proofIndexes[session] ?? -1;
  let next;
  if (pool.length === 1) {
    next = 0;
  } else {
    do { next = Math.floor(Math.random() * pool.length); } while (next === last);
  }
  proofIndexes[session] = next;
  return pool[next];
}

const INCLUDES = {
  'Maternity':         ['Professional hair & makeup artist','Designer gown wardrobe','Studio, in-home, or outdoor location','Guided posing from start to finish','Curated gallery review — together'],

  'Newborn':           [['Pre-birth consultation','We connect before baby arrives to plan your session and lock in your date.'],['Session within 5–14 days','The ideal newborn window — curly, sleepy, perfectly fresh.'],['Gallery review together','I identify your favorites with you and build your collection around them.'],['Your keepsakes delivered','Prints, albums, and wall art crafted to last a lifetime.']],

  'Seniors':           [['Style & planning session','I plan your looks, locations, and the story we want to tell together.'],['Your session day','Studio and/or outdoor locations — usually 2–3 looks.'],['Gallery review','You pick your favorites. I build your senior collection around them.'],['Announcement-ready','Cards, prints, and digital files ready for everything ahead.']],
  'Branding':          [['Brand discovery call','I learn your brand personality, use cases, and exactly what images you need.'],['Your brand session','Studio, on-location, or both. Multiple looks and settings.'],['Curated delivery','A refined set of on-brand images — not 600 photos to sort through yourself.'],['Usage guidance','I help you figure out which images go where, so nothing sits unused.']],
  'Boudoir Maternity': [['Private consultation','We talk through your comfort level, styling vision, and what this session means to you.'],['Your session day','In-studio. Gown styling and hair & makeup ready for you.'],['Gallery review together','You tell me your favorites. No pressure, no surprises.'],['Your keepsakes','Printed albums, wall art, and digitals — designed to last.']],
};

const SERVICE_PAGES = {
  'Maternity':         'https://twowildsoulsphotography.com/metro-detroit-maternity-photography',
  'Newborn':           'https://twowildsoulsphotography.com/metro-detroit-newborn-photography',
  'Family':            'https://twowildsoulsphotography.com/metro-detroit-family-photography',
  'Seniors':           'https://twowildsoulsphotography.com/metro-detroit-senior-photography',
  'Branding':          'https://twowildsoulsphotography.com/metro-detroit-branding-photography',
  'Boudoir Maternity': 'https://twowildsoulsphotography.com/metro-detroit-maternity-boudoir-photography',
};

// ─── STATE ─────────────────────────────────────────────────────────
const state = { sessionType: null, timingStatus: null, timingNote: null, valueType: null, weeksPreg: null, newbornStatus: null, gradYear: null };
let queue = [], running = false, isDone = false;

// ─── DOM HELPERS ───────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const msgs = $('messages');
const chips = $('chips');

function scrollDown() { msgs.scrollTop = msgs.scrollHeight; }

function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

function getSpeed() { return window.__twsSpeed === 'fast' ? 0.2 : 1; }

// ─── BUILD ELEMENTS ────────────────────────────────────────────────

const JASMINE_PHOTO = 'https://static.showit.co/file/N0mLcuchHvT5zhas9MUvfg/331377/2025_headshot_7542-min.jpg';

function makeAvatar() {
  const d = document.createElement('div');
  d.className = 'avatar';
  const img = document.createElement('img');
  img.src = JASMINE_PHOTO;
  img.alt = 'Jasmine';
  img.loading = 'lazy';
  d.appendChild(img);
  return d;

// ─── QUEUE ENGINE ──────────────────────────────────────────────────
const SPEEDS = { text: 950, card: 800, short: 700, long: 1200 };

function Q(items) {
  queue.push(...items);
  if (!running) runQueue();
}

async function runQueue() {
  running = true;
  while (queue.length > 0) {
    const item = queue.shift();
    const spd = getSpeed();

    if (item.type === 'typing') {
      showTyping();
      await delay((item.ms || 950) * spd);
      hideTyping();
    } else if (item.type === 'text') {
      addTextBubble(item.html, item.side || 'studio');
      await delay(100);
      scrollDown();
    } else if (item.type === 'testimonial') {
      addTestimonial(item.session);
    } else if (item.type === 'includes') {
      addIncludes(item.session);
    } else if (item.type === 'comparison') {
      addComparison();
    } else if (item.type === 'process') {
      addProcess(item.session);
    } else if (item.type === 'quote') {
      addQuote(item.session);
    } else if (item.type === 'confirm') {
      addConfirm(item.status, item.session);
    } else if (item.type === 'notafit') {
      addNotAFit(item.isNewborn);
    } else if (item.type === 'extended_family') {
      addExtendedFamily();
    } else if (item.type === 'form') {
      addForm();
    } else if (item.type === 'chips') {
      setChips(item.opts);
    } else if (item.type === 'fn') {
      item.fn();
    }
  }
  running = false;
}

function say(html, ms) {
  return [{ type: 'typing', ms: ms || SPEEDS.text }, { type: 'text', html, side: 'studio' }];
}
function showCard(kind, props, ms) {
  return [{ type: 'typing', ms: ms || SPEEDS.card }, { type: kind, ...props }];
}

function setChips(opts) {
  chips.innerHTML = '';
  if (!opts || opts.length === 0) { chips.classList.add('hidden'); return; }
  chips.classList.remove('hidden');
  opts.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'chip';
    btn.textContent = opt.label;
    btn.addEventListener('click', () => handleOpt(opt));
    chips.appendChild(btn);
  });
  scrollDown();
}

function hideChips() {
  chips.classList.add('hidden');
  chips.innerHTML = '';
}

    Q([
      ...say("How exciting! How far along are you?", SPEEDS.short),
      { type: 'chips', opts: [
        { label: 'Just found out — under 12 weeks', action: 'mat_u12' },
        { label: '12 – 17 weeks',                   action: 'mat_u18' },
        { label: '18 – 24 weeks',                   action: 'mat_ideal' },

  }

  // EDUCATION
  else if (a === 'edu_yes') {
    Q([{ type: 'fn', fn: goValueQ }]);
  } else if (a === 'edu_more') {
    Q([{ type: 'fn', fn: goProcess }]);
  } else if (a === 'edu_service') {
    const url = SERVICE_PAGES[state.sessionType] || SERVICE_PAGES['Maternity'];
    window.open(url, '_blank');
    Q([
      ...say("Opening that in a new tab for you — come back whenever you're ready and I'll pick right up.", SPEEDS.text),
      { type: 'fn', fn: goValueQ },
    ]);
  } else if (a === 'edu_includes') {
    Q([
      ...showCard('includes', { session: state.sessionType }, 500),
      ...say("I coordinate every single thing for you. You just show up.", SPEEDS.short),
      { type: 'fn', fn: goValueQ },
    ]);
  }

  // VALUE QUALIFIER
  else if (a === 'value_simple') {
    state.valueType = 'not_a_fit';
    if (state.sessionType === 'Newborn') {
      Q([
        ...say("Got it — I actually have something that might be a great fit.", SPEEDS.short),
        ...showCard('notafit', { isNewborn: true }, 500),
      ]);
    } else {
      Q([
        ...say("Got it — I actually have something that might be perfect for you.", SPEEDS.short),
        ...showCard('notafit', { isNewborn: false }, 500),
      ]);
    }
    isDone = true;
  }

  // FAMILY SIZE BRANCH
  else if (a === 'family_immediate') {
    Q([
      ...say("That's exactly the kind of session I love creating.", SPEEDS.short),
      { type: 'fn', fn: goCapture },
    ]);
  } else if (a === 'family_extended') {
    Q([
      ...say("Extended family sessions are some of the most treasured work I do.", SPEEDS.short),
      ...showCard('extended_family', {}, 500),
    ]);
    isDone = true;
  } else if (a === 'value_heirloom' || a === 'value_keepsake' || a === 'value_digital' || a === 'value_full') {
    state.valueType = a;
    if (state.sessionType === 'Family') {
      Q([
        ...say("Love it. One quick question —", SPEEDS.short),
        ...say("Is this for your immediate family, or are you bringing extended family together?", SPEEDS.short),
        { type: 'chips', opts: [
          { label: 'Immediate family — up to 8 people',      action: 'family_immediate' },
          { label: 'Extended family — multiple households',  action: 'family_extended' },
        ]},
      ]);
    } else {
      Q([
        ...say("That's exactly the kind of session Jasmine loves creating.", SPEEDS.short),
        { type: 'fn', fn: goCapture },
      ]);
    }
  }
}

// ─── FORM SUBMIT ───────────────────────────────────────────────────
async function handleFormSubmit() {
  const firstName = $('f-first').value.trim();
  const lastName  = $('f-last').value.trim();
  const email     = $('f-email').value.trim();
  const phone     = $('f-phone').value.trim();
  const err = $('f-error');

  [$('f-first'),$('f-last'),$('f-email'),$('f-phone')].forEach(el => el.classList.remove('error'));
  err.style.display = 'none';

  let hasErr = false;
  if (!firstName) { $('f-first').classList.add('error'); hasErr = true; }
  if (!lastName)  { $('f-last').classList.add('error');  hasErr = true; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { $('f-email').classList.add('error'); hasErr = true; }
  if (!phone)     { $('f-phone').classList.add('error'); hasErr = true; }
  if (hasErr) { err.style.display = 'block'; return; }

  const btn = $('f-btn');
  btn.disabled = true;
  btn.textContent = 'Reserving your spot…';

  try {
    const timing = state.timingStatus || 'contact_now';
    const payload = {
      data: {
        type: 'subscription',
        attributes: {
          custom_source: 'Studio Guide Chat',
          profile: {
            data: {
              type: 'profile',
              attributes: {
                email, phone_number: phone, first_name: firstName, last_name: lastName,
                properties: {
                  vip_session_type:   state.sessionType   || '',
                  vip_qualification:  timing,
                  vip_contact_now:    timing === 'contact_now' ? 'yes' : 'no',
                  vip_timing_note:    state.timingNote    || '',
                  vip_value_type:     state.valueType     || '',
                  vip_weeks_pregnant: state.weeksPreg     || '',
                  vip_newborn_status: state.newbornStatus || '',
                  vip_grad_year:      state.gradYear      || '',
                  vip_source:         'Studio Guide Chat',
                }
              }
            }
          }
        },
        relationships: { list: { data: { type: 'list', id: KLAVIYO_LIST_ID } } }
      }
    };
    await fetch(`https://a.klaviyo.com/client/subscriptions/?company_id=${KLAVIYO_PUBLIC_KEY}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'revision': '2023-02-22' },
      body: JSON.stringify(payload)
    });
  } catch(e) { console.warn('Klaviyo:', e); }

  const formRow = $('form-row');
  if (formRow) formRow.remove();

  addTextBubble(`${firstName} ${lastName} · ${email}`, 'user');
  isDone = true;
  Q([
    ...showCard('confirm', { status: state.timingStatus || 'contact_now', session: state.sessionType }, 700),
    ...say("I have everything I need — I'll reach out personally and we'll pick up right where this left off. Can't wait to connect. 🤍", SPEEDS.long),
  ]);
}

window.__twsSpeed = 'real';

// ─── IFRAME CONTEXT ────────────────────────────────────────────────
// Detect if running inside the launcher iframe
(function() {
  try {
    if (window.self !== window.top) {
      document.body.classList.add('in-iframe');
    }
  } catch(e) {
    document.body.classList.add('in-iframe'); // cross-origin = definitely in iframe
  }

  // iOS visual viewport keyboard handling
  var isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
  if (isIOS && window.visualViewport) {
    function updateVVH() {
      document.documentElement.style.setProperty('--vvh', window.visualViewport.height + 'px');
      // If keyboard is up (viewport shrunk significantly), add class
      var ratio = window.visualViewport.height / window.screen.height;
      document.body.classList.toggle('ios-kb', ratio < 0.75);
      scrollDown();
    }
    window.visualViewport.addEventListener('resize', updateVVH);
    window.visualViewport.addEventListener('scroll', updateVVH);
  }

  // Listen for parent panel open signal — scroll to bottom on reveal
  window.addEventListener('message', function(e) {
    if (e.data && e.data.type === 'tws_panel_open') {
      scrollDown();
    }
  });
})();
</script>
